<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>시안 18 · 맵 마커 스포트라이트 & 리플</title>
<style>
  :root{ --bg:#0a0a0b; --card:#161618; --border:#27272a; --muted:#a1a1aa; --fg:#fafafa; }
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,system-ui,sans-serif;min-height:100vh;padding:40px}
  h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 4px}
  p.sub{margin:0 0 22px;color:#71717a;font-size:13px;max-width:720px}
  .map{position:relative;max-width:820px;height:440px;border-radius:16px;border:1px solid var(--border);overflow:hidden;
       background:radial-gradient(700px 400px at 60% 30%,#0e2233,#0b0f14);cursor:crosshair}
  .grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
  .spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(240px circle at var(--mx,-999px) var(--my,-999px),transparent 0,rgba(0,0,0,.45) 100%);transition:background .1s}
  .marker{position:absolute;transform:translate(-50%,-50%);cursor:pointer}
  .marker .pin{width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid #0b0f14;box-shadow:0 0 12px var(--c)}
  .marker .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c);opacity:0}
  .marker.alarm .ring{animation:ripple 1.6s ease-out infinite;opacity:1}
  @keyframes ripple{0%{transform:scale(.6);opacity:.8}100%{transform:scale(3);opacity:0}}
  .marker .lbl{position:absolute;left:14px;top:-6px;white-space:nowrap;font-size:11px;background:rgba(0,0,0,.6);border:1px solid #3f3f46;padding:2px 7px;border-radius:6px;opacity:0;transition:.2s}
  .marker:hover .lbl,.marker.sel .lbl{opacity:1}
  .marker.sel{z-index:5}
  .marker.sel .pin{transform:scale(1.5)}
  .marker.sel::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid #fff;animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.4);opacity:1}to{transform:scale(1);opacity:0}}
</style>
</head>
<body>
  <h1>시안 18 — 맵 마커 스포트라이트 & 리플</h1>
  <p class="sub">GIS 관망도. 마우스를 따라 스포트라이트(주변 어둡게)로 집중, 알람 시설은 리플로 맥동. 마커 클릭 시 스케일 업 + 하이라이트 링. (시설 마커 강조)</p>
  <div class="map" id="map">
    <div class="grid"></div><div class="spot" id="spot"></div>
  </div>
<script>
  const M=[['죽동 배수지','#38bdf8',30,40,true],['신평 가압장','#a78bfa',62,28,false],['남산2 배수지','#34d399',48,64,false],
    ['갈산 가압장','#fbbf24',75,58,true],['행정 배수지','#f87171',22,72,false],['합덕 배수지','#38bdf8',82,34,false],['성하리 배수지','#34d399',40,20,false]];
  const map=document.getElementById('map'),spot=document.getElementById('spot');
  M.forEach(m=>{const el=document.createElement('div');el.className='marker'+(m[4]?' alarm':'');el.style.cssText=`left:${m[2]}%;top:${m[3]}%;--c:${m[1]}`;
    el.innerHTML=`<div class="ring"></div><div class="pin"></div><div class="lbl">${m[0]}${m[4]?' · ⚠ 알람':''}</div>`;
    el.onclick=e=>{e.stopPropagation();document.querySelectorAll('.marker').forEach(x=>x.classList.remove('sel'));el.classList.remove('sel');void el.offsetWidth;el.classList.add('sel');};
    map.appendChild(el);});
  map.addEventListener('mousemove',e=>{const r=map.getBoundingClientRect();spot.style.setProperty('--mx',(e.clientX-r.left)+'px');spot.style.setProperty('--my',(e.clientY-r.top)+'px');});
  map.addEventListener('mouseleave',()=>{spot.style.setProperty('--mx','-999px');});
</script>
</body>
</html>
