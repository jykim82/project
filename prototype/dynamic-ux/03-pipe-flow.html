<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>시안 03 · 관로 유량 흐름 애니메이션</title>
<style>
  :root{ --bg:#0a0a0b; --card:#161618; --border:#27272a; --muted:#a1a1aa; --fg:#fafafa; }
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,system-ui,sans-serif;min-height:100vh;padding:40px}
  h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 4px}
  p.sub{margin:0 0 24px;color:#71717a;font-size:13px;max-width:720px}
  .stage{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:860px}
  .node{fill:#18181b;stroke:#3f3f46;stroke-width:2}
  .node.hl{stroke:#38bdf8}
  .lbl{fill:#e4e4e7;font-size:13px;font-family:inherit}
  .sub2{fill:#71717a;font-size:11px;font-family:inherit}
  .pipe{stroke:#27272a;stroke-width:10;fill:none;stroke-linecap:round}
  .flow{stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:2 16;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .legend{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--muted)}
  .legend b{color:#fafafa}
  .chip{display:inline-flex;gap:6px;align-items:center}
  .sw{width:22px;height:4px;border-radius:2px}
</style>
</head>
<body>
  <h1>시안 03 — 관로 유량 흐름 애니메이션 (SVG)</h1>
  <p class="sub">계통도/GIS 관망도에서 유량의 방향·세기를 흐르는 점선으로 표현. 유량이 많을수록 흐름이 빠르고 굵으며, 불균형 구간은 붉게. 정지 구간은 흐름 없음.</p>
  <div class="stage">
    <svg viewBox="0 0 820 320" width="100%">
      <!-- pipes -->
      <path class="pipe" d="M110,90 H360"/><path class="flow" d="M110,90 H360" style="stroke:#38bdf8;animation-duration:.7s"/>
      <path class="pipe" d="M360,90 V210 H610"/><path class="flow" d="M360,90 V210 H610" style="stroke:#34d399;animation-duration:1.1s"/>
      <path class="pipe" d="M360,90 H610"/><path class="flow" d="M360,90 H610" style="stroke:#f87171;stroke-width:5;animation-duration:.45s;stroke-dasharray:2 14"/>
      <path class="pipe" d="M610,90 V210"/><!-- 정지: 흐름 없음 -->
      <!-- nodes -->
      <g><rect class="node hl" x="40" y="60" width="70" height="60" rx="10"/><text class="lbl" x="75" y="88" text-anchor="middle">취수장</text><text class="sub2" x="75" y="105" text-anchor="middle">유입 ●</text></g>
      <g><rect class="node" x="325" y="60" width="70" height="60" rx="10"/><text class="lbl" x="360" y="88" text-anchor="middle">배수지</text><text class="sub2" x="360" y="105" text-anchor="middle">3.2m</text></g>
      <g><rect class="node" x="575" y="60" width="70" height="60" rx="10"/><text class="lbl" x="610" y="88" text-anchor="middle">가압장</text><text class="sub2" x="610" y="105" text-anchor="middle" style="fill:#f87171">불균형</text></g>
      <g><rect class="node" x="325" y="180" width="70" height="60" rx="10"/><text class="lbl" x="360" y="208" text-anchor="middle">소블록A</text></g>
      <g><rect class="node" x="575" y="180" width="70" height="60" rx="10"/><text class="lbl" x="610" y="208" text-anchor="middle">소블록B</text><text class="sub2" x="610" y="225" text-anchor="middle" style="fill:#52525b">정지</text></g>
    </svg>
    <div class="legend">
      <span class="chip"><span class="sw" style="background:#38bdf8"></span>정상 유량</span>
      <span class="chip"><span class="sw" style="background:#34d399"></span>저유량</span>
      <span class="chip"><span class="sw" style="background:#f87171"></span>과유량/불균형</span>
      <span class="chip"><span class="sw" style="background:#27272a"></span>정지(흐름 없음)</span>
    </div>
  </div>
</body>
</html>
