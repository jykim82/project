<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>시안 08 · 실시간 스파크라인 & 스트리밍 차트</title>
<style>
  :root{ --bg:#0a0a0b; --card:#161618; --border:#27272a; --muted:#a1a1aa; --fg:#fafafa; }
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,system-ui,sans-serif;min-height:100vh;padding:40px}
  h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 4px}
  p.sub{margin:0 0 24px;color:#71717a;font-size:13px;max-width:720px}
  .wrap{max-width:820px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .cur{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .cur small{font-size:14px;color:var(--muted);font-weight:500}
  .badge{font-size:11px;color:#34d399;background:rgba(52,211,153,.12);padding:3px 9px;border-radius:6px}
  canvas{width:100%;height:180px;display:block}
  .mini{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
  .m{flex:1;min-width:150px;background:#0f0f11;border:1px solid #27272a;border-radius:10px;padding:12px}
  .m .l{font-size:11px;color:var(--muted)}.m .v{font-size:18px;font-weight:700;margin-top:2px}
  .m canvas{height:36px}
</style>
</head>
<body>
  <h1>시안 08 — 실시간 스파크라인 & 스트리밍 트렌드</h1>
  <p class="sub">태그 모니터링/트렌드. 값이 우측에서 흘러 들어오며 라인이 매끄럽게 이어짐. 그라디언트 채움 + 현재값 배지. 작은 스파크라인은 목록의 각 행에 인라인.</p>
  <div class="wrap">
    <div class="head">
      <div><div class="lbl" style="font-size:12px;color:#a1a1aa">죽동 배수지 · 유출유량</div>
        <div class="cur"><span id="cur">1403</span> <small>m³/h</small> <span class="badge" id="bd">▲ 실시간</span></div></div>
    </div>
    <canvas id="main" width="1560" height="360"></canvas>
    <div class="mini" id="mini"></div>
  </div>
<script>
  function mk(n,base,amp){return Array.from({length:n},()=>base+(Math.random()-.5)*amp)}
  function draw(c,data,col,fill=true){
    const x=c.getContext('2d'),w=c.width,h=c.height;const mn=Math.min(...data),mx=Math.max(...data),rng=(mx-mn)||1;
    x.clearRect(0,0,w,h);const pad=10;
    const pts=data.map((v,i)=>[i/(data.length-1)*w,h-pad-((v-mn)/rng)*(h-pad*2)]);
    x.beginPath();pts.forEach((p,i)=>{if(!i){x.moveTo(p[0],p[1]);return;}const q=pts[i-1];const mx2=(q[0]+p[0])/2;x.bezierCurveTo(mx2,q[1],mx2,p[1],p[0],p[1]);});
    if(fill){x.save();x.lineTo(w,h);x.lineTo(0,h);x.closePath();const gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');x.fillStyle=gr;x.fill();x.restore();
      x.beginPath();pts.forEach((p,i)=>{if(!i){x.moveTo(p[0],p[1]);return;}const q=pts[i-1];const mx2=(q[0]+p[0])/2;x.bezierCurveTo(mx2,q[1],mx2,p[1],p[0],p[1]);});}
    x.strokeStyle=col;x.lineWidth=fill?3:2;x.stroke();
    const last=pts[pts.length-1];x.beginPath();x.arc(last[0],last[1],fill?5:3,0,7);x.fillStyle=col;x.fill();
  }
  const main=mk(60,1400,140);
  function tickMain(){main.push(1400+(Math.random()-.5)*160);main.shift();
    const v=Math.round(main[main.length-1]);document.getElementById('cur').textContent=v.toLocaleString();
    const rising=main[main.length-1]>main[main.length-2];const bd=document.getElementById('bd');
    bd.textContent=(rising?'▲':'▼')+' 실시간';bd.style.color=rising?'#34d399':'#f87171';bd.style.background=rising?'rgba(52,211,153,.12)':'rgba(248,113,113,.12)';
    draw(document.getElementById('main'),main,'#38bdf8');}
  const MINI=[{l:'토출압력',u:'kgf',b:5.4,a:.6,c:'#a78bfa'},{l:'흡수정 수위',u:'m',b:1.9,a:.4,c:'#34d399'},{l:'펌프 전류',u:'A',b:38,a:5,c:'#fbbf24'}];
  const mini=document.getElementById('mini');
  MINI.forEach(m=>{m.d=mk(40,m.b,m.a);const el=document.createElement('div');el.className='m';
    el.innerHTML=`<div class="l">${m.l}</div><div class="v"><span class="mv">${m.b.toFixed(1)}</span> <small style="font-size:11px;color:#a1a1aa">${m.u}</small></div><canvas width="300" height="72"></canvas>`;
    mini.appendChild(el);m.el=el;});
  function tickMini(){MINI.forEach(m=>{m.d.push(m.b+(Math.random()-.5)*m.a);m.d.shift();
    m.el.querySelector('.mv').textContent=m.d[m.d.length-1].toFixed(1);draw(m.el.querySelector('canvas'),m.d,m.c,false);});}
  tickMain();tickMini();setInterval(tickMain,1000);setInterval(tickMini,1200);
</script>
</body>
</html>
