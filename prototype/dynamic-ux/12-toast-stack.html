<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>시안 12 · 토스트 알림 스택</title>
<style>
  :root{ --bg:#0a0a0b; --card:#161618; --border:#27272a; --muted:#a1a1aa; --fg:#fafafa; }
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,system-ui,sans-serif;min-height:100vh;padding:40px}
  h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 4px}
  p.sub{margin:0 0 22px;color:#71717a;font-size:13px;max-width:720px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{background:#27272a;border:1px solid #3f3f46;color:#e4e4e7;padding:9px 15px;border-radius:9px;font-size:13px;cursor:pointer}
  button:hover{background:#3f3f46}
  .toasts{position:fixed;top:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:80;width:320px}
  .toast{background:#161618;border:1px solid #2b2b30;border-left-width:4px;border-radius:12px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;
         box-shadow:0 12px 34px rgba(0,0,0,.45);animation:in .35s cubic-bezier(.2,.9,.2,1);position:relative;overflow:hidden}
  .toast.out{animation:out .3s ease forwards}
  @keyframes in{from{opacity:0;transform:translateX(40px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(40px);height:0;padding-top:0;padding-bottom:0;margin-top:-10px}}
  .toast .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .toast .t{font-size:13.5px;font-weight:600}.toast .m{font-size:12px;color:#a1a1aa;margin-top:2px}
  .toast .x{margin-left:auto;color:#52525b;cursor:pointer;font-size:13px}
  .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;transform-origin:left;animation:cd var(--d) linear forwards}
  @keyframes cd{to{transform:scaleX(0)}}
  .ok{border-left-color:#34d399}.ok .ic{background:rgba(52,211,153,.15);color:#34d399}.ok .bar{background:#34d399}
  .info{border-left-color:#38bdf8}.info .ic{background:rgba(56,189,248,.15);color:#38bdf8}.info .bar{background:#38bdf8}
  .warn{border-left-color:#f87171}.warn .ic{background:rgba(248,113,113,.15);color:#f87171}.warn .bar{background:#f87171}
</style>
</head>
<body>
  <h1>시안 12 — 토스트 알림 스택 (자동 소멸 + 진행바)</h1>
  <p class="sub">저장/삭제/알람 등 액션 피드백을 우상단에 스택으로. 슬라이드 진입, 남은시간 진행바, 자동 소멸(호버 시 일시정지 권장). 실시간 알람 발생 통지에도.</p>
  <div class="btns">
    <button onclick="push('ok','저장 완료','설비 정보가 저장되었습니다.')">✓ 저장 성공</button>
    <button onclick="push('info','실시간 갱신','기준선 캐시 432태그 갱신됨')">ℹ 정보</button>
    <button onclick="push('warn','알람 발생','죽동 배수지 수위#1 HH')">⚠ 경고 알람</button>
    <button onclick="for(let i=0;i<3;i++)setTimeout(()=>push(['ok','info','warn'][i%3],'다중 알림 '+(i+1),'스택 데모'),i*250)">📚 다중</button>
  </div>
  <div class="toasts" id="toasts"></div>
<script>
  const ICON={ok:'✓',info:'ℹ',warn:'⚠'};
  function push(type,title,msg,dur=4200){
    const wrap=document.getElementById('toasts');
    const el=document.createElement('div');el.className='toast '+type;el.style.setProperty('--d',dur+'ms');
    el.innerHTML=`<span class="ic">${ICON[type]}</span><div><div class="t">${title}</div><div class="m">${msg}</div></div>
      <span class="x">✕</span><div class="bar"></div>`;
    wrap.prepend(el);
    const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);};
    el.querySelector('.x').onclick=close;
    let to=setTimeout(close,dur);
    el.onmouseenter=()=>{clearTimeout(to);el.querySelector('.bar').style.animationPlayState='paused';};
    el.onmouseleave=()=>{el.querySelector('.bar').style.animationPlayState='running';to=setTimeout(close,1200);};
  }
  push('info','SLM 실시간','WebSocket 연결됨 · 수신 대기');
</script>
</body>
</html>
