<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용수 흐름 — 접기/펼치기 다이어그램</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Pretendard','Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:linear-gradient(180deg,#131a2e,#0e1525);border-bottom:1px solid #1e293b;flex-shrink:0}
.header h1{font-size:15px;font-weight:700;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-right{display:flex;align-items:center;gap:10px}
.legend{display:flex;gap:10px;font-size:10px;color:#64748b}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:7px;height:7px;border-radius:50%}

.ctrl-bar{display:flex;align-items:center;gap:6px;padding:6px 20px;background:#0e1525;border-bottom:1px solid #1e293b;flex-shrink:0}
.ctrl-btn{padding:4px 10px;font-size:10px;border:1px solid #334155;border-radius:5px;background:#131a2e;color:#94a3b8;cursor:pointer;transition:all .2s}
.ctrl-btn:hover{background:#1e293b;color:#f1f5f9}
.ctrl-btn.active{background:#1e3a5f;border-color:#3b82f6;color:#60a5fa}
.ctrl-sep{width:1px;height:20px;background:#1e293b}
.zoom-label{font-size:10px;color:#475569;min-width:40px;text-align:center}

.search-wrap{position:relative}
.search-input{background:#0f172a;border:1px solid #334155;border-radius:5px;padding:4px 8px 4px 24px;color:#e2e8f0;font-size:10px;width:160px;outline:none}
.search-input:focus{border-color:#3b82f6}
.search-icon{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:11px;color:#64748b}
.search-results{position:absolute;top:100%;left:0;right:0;background:#1e293b;border:1px solid #334155;border-radius:0 0 5px 5px;max-height:200px;overflow-y:auto;z-index:50;display:none}
.search-results.show{display:block}
.sr-item{padding:5px 8px;font-size:10px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #0f172a}
.sr-item:hover{background:#334155}
.sr-ft{font-size:8px;color:#64748b}

/* 캔버스 */
.canvas{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#0c1629,#080d17);cursor:grab}
.canvas.dragging{cursor:grabbing}
.canvas-inner{position:absolute;transform-origin:0 0;transition:none}
.grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.04;background-image:linear-gradient(#334155 1px,transparent 1px),linear-gradient(90deg,#334155 1px,transparent 1px);background-size:60px 60px}

/* 레이어 라벨 */
.layer-label{position:absolute;font-size:9px;color:#334155;font-weight:600;letter-spacing:1px;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}

/* ── 노드 박스 (확대: 180×68) ── */
.nd{position:absolute;width:180px;height:68px;border-radius:10px;border:1.5px solid #1e293b;background:#111827;cursor:pointer;transition:border-color .25s,box-shadow .25s,filter .25s,opacity .3s;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden;user-select:none}
.nd:hover{border-color:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,.15)}
.nd.highlight{border-color:#60a5fa;box-shadow:0 0 20px rgba(59,130,246,.25)}
.nd.dim{opacity:.12;pointer-events:none}
.nd .nd-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd .nd-ft{font-size:9px;color:#64748b;margin-top:1px}
.nd .nd-metrics{display:flex;gap:6px;margin-top:3px;font-size:9px;color:#94a3b8}
.nd .nd-metrics b{font-weight:600;color:#cbd5e1}

/* 접힌 노드 → 하위 뱃지 */
.nd .collapse-badge{position:absolute;top:5px;right:8px;font-size:8px;color:#0f172a;background:#60a5fa;border-radius:10px;padding:1px 6px;font-weight:700}
.nd .expand-icon{position:absolute;bottom:5px;right:8px;font-size:10px;color:#475569;transition:color .2s}
.nd:hover .expand-icon{color:#94a3b8}

/* 상태 표시 */
.nd.st-ok{border-left:3px solid #34d399}
.nd.st-warn{border-left:3px solid #fbbf24;animation:pulse-warn 2s infinite}
.nd.st-err{border-left:3px solid #ef4444;animation:pulse-err 2s infinite}
.nd.st-off{border-left:3px solid #334155;opacity:.5}
@keyframes pulse-warn{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 10px 2px rgba(251,191,36,.1)}}
@keyframes pulse-err{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 10px 2px rgba(239,68,68,.12)}}

/* 엣지 SVG */
svg.edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:#1e293b;stroke-width:1.5;transition:stroke .3s,opacity .3s,stroke-width .3s}
.edge.hl{stroke:#3b82f6;stroke-width:2.5;opacity:1}
.edge.dim{opacity:.06}
.flow-particle{opacity:.85}
.flow-particle.dim{opacity:.04}

/* 미니맵 */
.minimap{position:absolute;bottom:12px;right:12px;width:200px;height:140px;background:#0f172a;border:1px solid #1e293b;border-radius:8px;overflow:hidden;opacity:.85}
.mm-viewport{position:absolute;border:1.5px solid #3b82f6;border-radius:2px;pointer-events:none}

/* 팝업 */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.popup-overlay.show{display:flex}
.popup{background:#131a2e;border:1px solid #1e293b;border-radius:12px;padding:20px;min-width:340px;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.popup-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.popup-title{font-size:15px;font-weight:700}
.popup-close{background:none;border:none;color:#64748b;cursor:pointer;font-size:16px}
.popup-body{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.popup-cell{background:#0f172a;border-radius:8px;padding:10px}
.pc-label{font-size:9px;color:#64748b;margin-bottom:4px}
.pc-val{font-size:16px;font-weight:700}
.popup-children{grid-column:1/-1;margin-top:4px}
.popup-children h4{font-size:10px;color:#64748b;margin-bottom:6px}
.popup-child-list{display:flex;flex-wrap:wrap;gap:4px}
.popup-child-tag{font-size:9px;padding:2px 8px;border-radius:4px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8}
.popup-child-tag.st-err{border-color:#ef4444;color:#fca5a5}
.popup-child-tag.st-warn{border-color:#fbbf24;color:#fde68a}
.popup-child-tag.st-off{opacity:.4}

/* 안내 툴팁 */
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#1e293b;color:#94a3b8;font-size:10px;padding:4px 14px;border-radius:20px;pointer-events:none;transition:opacity .5s;z-index:10}
</style>
</head>
<body>

<div class="header">
  <h1>💧 용수 흐름 — 접기/펼치기 다이어그램</h1>
  <div class="hdr-right">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div>정수장</div>
      <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div>배수지</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>가압장</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>소블록</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c4b5fd"></div>소소블록</div>
    </div>
  </div>
</div>

<div class="ctrl-bar">
  <div id="systemTabs"></div>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="expandAll()">전체 펼치기</button>
  <button class="ctrl-btn" onclick="collapseAll()">전체 접기</button>
  <div class="ctrl-sep"></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" placeholder="시설명 검색..." id="searchInput">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="zoomBy(1.2)">＋</button>
  <button class="ctrl-btn" onclick="zoomBy(1/1.2)">－</button>
  <button class="ctrl-btn" onclick="fitView()">맞춤</button>
  <span class="zoom-label" id="zoomLabel">100%</span>
</div>

<div class="canvas" id="canvas">
  <div class="grid-bg"></div>
  <div class="canvas-inner" id="canvasInner">
    <svg class="edges" id="edgesSvg"></svg>
  </div>
  <div class="minimap" id="minimap">
    <canvas id="mmCanvas" width="400" height="280"></canvas>
    <div class="mm-viewport" id="mmViewport"></div>
  </div>
  <div class="hint" id="hint">더블클릭: 펼치기/접기 · 클릭: 상세 · 휠: 줌</div>
</div>

<!-- 팝업 -->
<div class="popup-overlay" id="popup" onclick="if(event.target===this)closePopup()">
  <div class="popup">
    <div class="popup-hdr">
      <span class="popup-title" id="popupTitle"></span>
      <button class="popup-close" onclick="closePopup()">✕</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// 데이터 (flow-box-diagram.html과 동일)
// ═══════════════════════════════════════
const EDGES=[
["보령댐","정수장","석문","배수지"],["보령댐","정수장","행정","가압장"],
["아산","정수장","남산","배수지"],["아산","정수장","순성","가압장"],["아산","정수장","신평","배수지"],
["아산","정수장","신평공업","가압장"],["아산","정수장","신평생활","가압장"],
["아산","정수장","송악1","배수지"],["아산","정수장","송악2","배수지"],
["아산","정수장","송산2산단공업","배수지"],["아산","정수장","송산2산단생활","배수지"],
["석문","배수지","석문","가압장"],["석문","배수지","석문1","소블록"],["석문","배수지","석문2","소블록"],
["석문2","소블록","삼봉","가압장"],["삼봉","가압장","대호","가압장"],["대호","가압장","난지","가압장"],
["난지","가압장","도비도","소블록"],["난지","가압장","난지관광","배수지"],["난지","가압장","난지마을","배수지"],["난지","가압장","소난지도","소블록"],
["행정","가압장","행정","배수지"],
["행정","배수지","매방리","가압장"],["행정","배수지","행정1수청","소소블록"],["행정","배수지","성북1리 제1차","가압장"],
["행정","배수지","행정1-1","소블록"],["행정","배수지","행정1-2","소블록"],
["행정","배수지","수청2지구1","소블록"],["행정","배수지","행정2-1","소블록"],
["행정","배수지","수청2지구2","소블록"],["행정","배수지","행정2-2","소블록"],
["행정","배수지","수청2지구3","소블록"],["행정","배수지","행정2-3","소블록"],
["행정1수청","소소블록","수청1-1","소소블록"],
["성북1리 제1차","가압장","성북1리","배수지"],["성북1리 제1차","가압장","성북1리 제2차","가압장"],
["행정2-3","소블록","죽동","가압장"],["죽동","가압장","죽동","배수지"],["죽동","가압장","죽동2","배수지"],
["죽동","배수지","율사","가압장"],
["남산","배수지","남산1","소블록"],["남산","배수지","남산2","소블록"],["남산","배수지","남산3","소블록"],
["남산","배수지","남산4","소블록"],["남산","배수지","남산7","소블록"],["남산","배수지","남산8","소블록"],
["남산","배수지","남산9","소블록"],["남산","배수지","남산10","소블록"],["남산","배수지","남산11","소블록"],
["남산","배수지","죽동2","가압장"],["남산","배수지","용연2통","가압장"],
["남산8","소블록","남산5","소블록"],["남산8","소블록","남산6","소블록"],
["남산3","소블록","갈산","가압장"],["갈산","가압장","성북","가압장"],["성북","가압장","성북2","배수지"],
["남산4","소블록","삼화","가압장"],
["순성","가압장","양유","가압장"],["순성","가압장","성하리","가압장"],["순성","가압장","성상1","가압장"],["순성","가압장","성상2","가압장"],
["성하리","가압장","성하리","배수지"],
["신평","배수지","신평1","소블록"],["신평","배수지","신평2","소블록"],
["신평1","소블록","신평3","소블록"],["신평3","소블록","봉소","가압장"],["신평3","소블록","순성","가압장"],
["신평공업","가압장","우강","가압장"],["신평생활","가압장","우강","가압장"],
["우강","가압장","합덕","배수지"],["우강","가압장","합덕일반","배수지"],["우강","가압장","합덕인더스","배수지"],["우강","가압장","합덕일반산단","배수지"],
["합덕","배수지","석우","가압장"],["합덕","배수지","합덕1","소블록"],["합덕","배수지","합덕2","소블록"],["합덕","배수지","합덕4","소블록"],
["합덕2","소블록","합덕3","소블록"],
["송악1","배수지","복운","가압장"],["송악1","배수지","송악1-1","소블록"],["송악1","배수지","송악1-2","소블록"],
["송악2","배수지","송악2-1","소블록"],["송악2","배수지","송악2-2","소블록"],["송악2","배수지","송악2-3","소블록"],
["송악2","배수지","송악2-4","소블록"],["송악2","배수지","송악2-5","소블록"],
["송악2-1","소블록","기지시","가압장"],
["송산2산단공업","배수지","송산1","소블록"],["송산2산단공업","배수지","송산2산단공업","가압장"],
["송산2산단생활","배수지","송산2","소블록"],["송산2산단생활","배수지","송산2산단생활","가압장"],
["송산1","소블록","가곡","가압장"],["가곡","가압장","가곡","배수지"],
["고대리","가압장","고대리","배수지"],["천의리","가압장","천의리","배수지"],
["매방리","가압장","고대리","가압장"],["매방리","가압장","천의리","가압장"],
];

const FTC={"정수장":"#38bdf8","배수지":"#34d399","가압장":"#fbbf24","소블록":"#a78bfa","소소블록":"#c4b5fd","감압시설":"#22d3ee"};
function nid(s,f){return s+"__"+f}

// ── 그래프 빌드 ──
const NM=new Map();
EDGES.forEach(([us,uf,ds,df])=>{
  const u=nid(us,uf),d=nid(ds,df);
  if(!NM.has(u))NM.set(u,{sn:us,ft:uf,ch:new Set(),pa:new Set(),dep:0});
  if(!NM.has(d))NM.set(d,{sn:ds,ft:df,ch:new Set(),pa:new Set(),dep:0});
  NM.get(u).ch.add(d);NM.get(d).pa.add(u);
});

// BFS depth
const roots=[...NM.entries()].filter(([,v])=>!v.pa.size).map(([k])=>k);
{const q=[...roots];roots.forEach(r=>NM.get(r).dep=0);
while(q.length){const c=q.shift();const nd=NM.get(c);nd.ch.forEach(k=>{const cn=NM.get(k);if(cn.dep<nd.dep+1){cn.dep=nd.dep+1;q.push(k)}})}}

// 시뮬레이션 상태/메트릭
const ST={},MET={};
NM.forEach((v,k)=>{
  const r=Math.random();let s="ok";
  if(k.includes("합덕일반__배수지"))s="err";
  else if(k.includes("합덕인더스__")||k.includes("남산11__"))s="warn";
  else if(k.includes("신평1__소블록")||k.includes("남산10__"))s="off";
  else if(r<.04)s="err";else if(r<.1)s="warn";else if(r<.16)s="off";
  ST[k]=s;
  MET[k]={q:s==="off"?0:Math.round(20+Math.random()*180),p:+(1+Math.random()*5).toFixed(1),h:v.ft==="배수지"?+(1+Math.random()*8).toFixed(1):null};
});
MET[nid("합덕일반","배수지")]={q:18,p:0.8,h:1.2};
MET[nid("합덕인더스","배수지")]={q:45,p:2.1,h:2.8};

// ═══════════════════════════════════════
// 접기/펼치기 상태
// ═══════════════════════════════════════
// collapsed: Set of node ids whose children are hidden
const collapsed=new Set();

// 초기 상태: 자식이 있는 모든 노드를 접기 (depth 1+ 만)
NM.forEach((v,k)=>{
  if(v.ch.size>0 && v.dep>=1) collapsed.add(k);
});

// BFS: 접힌 노드 아래 모든 자손 구하기
function getHiddenDescendants(){
  const hidden=new Set();
  // collapsed 노드의 자식을 BFS로 모두 숨김
  // 단, collapsed 노드 자체는 보여야 함
  function hideBelow(id){
    NM.get(id)?.ch.forEach(ch=>{
      if(hidden.has(ch))return;
      hidden.add(ch);
      // 접힌 상태이든 아니든, 부모가 숨겨진 자식이면 아래도 숨김
      hideBelow(ch);
    });
  }
  collapsed.forEach(id=>{
    if(!hidden.has(id)) hideBelow(id); // collapsed 노드 자체가 숨겨져 있으면 스킵
  });
  return hidden;
}

// 접힌 노드의 하위 통계 (총 자손 수, 총 유량, 상태 요약)
function getSubtreeStats(id){
  const stats={count:0,totalQ:0,err:0,warn:0,off:0,ok:0};
  const visited=new Set();
  function dfs(nid){
    NM.get(nid)?.ch.forEach(ch=>{
      if(visited.has(ch))return;
      visited.add(ch);
      stats.count++;
      stats.totalQ+=(MET[ch]?.q??0);
      const s=ST[ch]||'ok';
      stats[s]=(stats[s]||0)+1;
      dfs(ch);
    });
  }
  dfs(id);
  return stats;
}

function toggleCollapse(id){
  if(collapsed.has(id)){
    collapsed.delete(id);
  } else if(NM.get(id)?.ch.size>0){
    collapsed.add(id);
  }
  renderAll();
}

function expandAll(){
  collapsed.clear();
  renderAll();
}

function collapseAll(){
  NM.forEach((v,k)=>{if(v.ch.size>0 && v.dep>=1)collapsed.add(k)});
  renderAll();
}

// 특정 노드까지 경로를 펼치기 (검색용)
function expandPathTo(id){
  // 상위 경로 펼치기
  const visited=new Set();
  function findAndExpand(target){
    const queue=[[target]];
    while(queue.length){
      const path=queue.shift();
      const cur=path[path.length-1];
      if(visited.has(cur))continue;
      visited.add(cur);
      NM.get(cur)?.pa.forEach(p=>{
        collapsed.delete(p);
        queue.push([...path,p]);
      });
    }
  }
  findAndExpand(id);
}

// BFS 서브트리
function bfsSub(root){const s=new Set([root]),q=[root];while(q.length){const c=q.shift();NM.get(c)?.ch.forEach(k=>{if(!s.has(k)){s.add(k);q.push(k)}})};return s}
const SYS=[
  {name:"전체",filter:null},
  {name:"보령댐 계통",filter:bfsSub(nid("보령댐","정수장"))},
  {name:"아산 계통",filter:bfsSub(nid("아산","정수장"))},
];

// ═══════════════════════════════════════
// 레이아웃
// ═══════════════════════════════════════
const NW=180,NH=68,COL_GAP=240,ROW_GAP=14,GROUP_GAP=24,PAD_L=70,PAD_T=40;

function layoutNodes(filterSet){
  const hidden=getHiddenDescendants();
  let allNodes=filterSet?[...filterSet]:[...NM.keys()];
  // 숨겨진 노드 제외
  const nodes=allNodes.filter(id=>!hidden.has(id));

  const layers=new Map();
  nodes.forEach(id=>{const d=NM.get(id).dep;if(!layers.has(d))layers.set(d,[]);layers.get(d).push(id)});
  const pos=new Map();
  const sortedLayers=[...layers.entries()].sort((a,b)=>a[0]-b[0]);

  // 초기 배치
  sortedLayers.forEach(([dep,ids])=>{
    ids.forEach((id,i)=>pos.set(id,{x:PAD_L+dep*COL_GAP,y:PAD_T+i*(NH+ROW_GAP)}));
  });

  // 4 라운드 Sugiyama median heuristic
  for(let round=0;round<4;round++){
    sortedLayers.forEach(([dep,ids])=>{
      if(dep===0)return;
      ids.sort((a,b)=>{
        const medA=median([...NM.get(a).pa].filter(p=>pos.has(p)).map(p=>pos.get(p).y));
        const medB=median([...NM.get(b).pa].filter(p=>pos.has(p)).map(p=>pos.get(p).y));
        return medA-medB;
      });
      let prevParent=null,cy=PAD_T;
      ids.forEach(id=>{
        const parents=[...NM.get(id).pa].filter(p=>pos.has(p));
        const primary=parents.length?parents.reduce((a,b)=>pos.get(a).y<pos.get(b).y?a:b):null;
        if(prevParent!==null&&primary!==prevParent)cy+=GROUP_GAP;
        pos.set(id,{x:PAD_L+dep*COL_GAP,y:cy});
        cy+=NH+ROW_GAP;
        prevParent=primary;
      });
    });
    for(let li=sortedLayers.length-1;li>=0;li--){
      const [dep,ids]=sortedLayers[li];
      ids.sort((a,b)=>{
        const chA=[...NM.get(a).ch].filter(c=>pos.has(c));
        const chB=[...NM.get(b).ch].filter(c=>pos.has(c));
        return median(chA.map(c=>pos.get(c).y))-median(chB.map(c=>pos.get(c).y));
      });
      let prevParent=null,cy=PAD_T;
      ids.forEach(id=>{
        const parents=[...NM.get(id).pa].filter(p=>pos.has(p));
        const primary=parents.length?parents.reduce((a,b)=>pos.get(a).y<pos.get(b).y?a:b):null;
        if(prevParent!==null&&primary!==prevParent)cy+=GROUP_GAP;
        pos.set(id,{x:PAD_L+dep*COL_GAP,y:cy});
        cy+=NH+ROW_GAP;
        prevParent=primary;
      });
    }
  }

  // 부모→자식 중앙 정렬
  sortedLayers.forEach(([dep,ids])=>{
    if(dep===0)return;
    const groups=new Map();
    ids.forEach(id=>{
      const parents=[...NM.get(id).pa].filter(p=>pos.has(p));
      const primary=parents.length?parents.reduce((a,b)=>pos.get(a).y<pos.get(b).y?a:b):'_none';
      if(!groups.has(primary))groups.set(primary,[]);
      groups.get(primary).push(id);
    });
    groups.forEach((children,parentId)=>{
      if(parentId==='_none')return;
      const parentY=pos.get(parentId).y+NH/2;
      const totalH=children.length*(NH+ROW_GAP)-ROW_GAP;
      let startY=parentY-totalH/2;
      if(startY<PAD_T)startY=PAD_T;
      children.forEach((id,i)=>{pos.get(id).y=startY+i*(NH+ROW_GAP)});
    });
  });

  // 겹침 해소
  sortedLayers.forEach(([dep,ids])=>{
    ids.sort((a,b)=>pos.get(a).y-pos.get(b).y);
    for(let i=1;i<ids.length;i++){
      const prev=pos.get(ids[i-1]);
      const cur=pos.get(ids[i]);
      const minY=prev.y+NH+ROW_GAP;
      if(cur.y<minY)cur.y=minY;
    }
  });

  return {pos,nodes,edges:EDGES.filter(([us,uf,ds,df])=>{
    const u=nid(us,uf),d=nid(ds,df);
    return pos.has(u)&&pos.has(d);
  })};
}

function median(arr){
  if(!arr.length)return 0;
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

// 렌더링
// ═══════════════════════════════════════
let currentLayout=null,selectedNode=null;
let zoom=1,panX=0,panY=0;
let currentSys=0;

function renderAll(){
  const filter=SYS[currentSys].filter;
  currentLayout=layoutNodes(filter);
  render(currentLayout);
  setTimeout(fitView,50);
}

function render({pos,nodes,edges}){
  const inner=document.getElementById("canvasInner");
  // 기존 노드 제거
  inner.querySelectorAll(".nd,.layer-label").forEach(e=>e.remove());

  let maxX=0,maxY=0;
  const hidden=getHiddenDescendants();

  nodes.forEach(id=>{
    const n=NM.get(id);
    const p=pos.get(id);
    if(!p)return;
    maxX=Math.max(maxX,p.x+NW+60);
    maxY=Math.max(maxY,p.y+NH+60);

    const div=document.createElement("div");
    div.className=`nd st-${ST[id]||'ok'}`;
    div.style.left=p.x+"px";div.style.top=p.y+"px";
    div.style.borderColor=FTC[n.ft]||'#1e293b';
    div.dataset.id=id;

    const m=MET[id]||{};
    let metrics='';
    if(m.q!=null)metrics+=`Q:<b>${m.q}</b> `;
    if(m.p!=null)metrics+=`P:<b>${m.p}</b> `;
    if(m.h!=null)metrics+=`H:<b>${m.h}</b>`;

    const isCollapsed=collapsed.has(id);
    const hasChildren=n.ch.size>0;
    const visibleChildren=[...n.ch].filter(c=>!hidden.has(c)&&pos.has(c));

    let badgeHtml='';
    let expandHtml='';
    if(hasChildren){
      if(isCollapsed){
        const stats=getSubtreeStats(id);
        badgeHtml=`<span class="collapse-badge">${stats.count}개 접힘</span>`;
        expandHtml=`<span class="expand-icon">▶ 펼치기</span>`;
      } else {
        expandHtml=`<span class="expand-icon">▼ 접기</span>`;
      }
    }

    div.innerHTML=`
      <div class="nd-name">${n.sn}</div>
      <div class="nd-ft">${n.ft}</div>
      <div class="nd-metrics">${metrics}</div>
      ${badgeHtml}${expandHtml}
    `;

    div.addEventListener("click",(e)=>{
      e.stopPropagation();
      onNodeClick(id);
    });
    div.addEventListener("dblclick",(e)=>{
      e.stopPropagation();
      e.preventDefault();
      toggleCollapse(id);
    });
    inner.appendChild(div);
  });

  // 엣지 SVG
  const svg=document.getElementById("edgesSvg");
  svg.setAttribute("width",maxX);svg.setAttribute("height",maxY);
  svg.innerHTML='';

  edges.forEach(([us,uf,ds,df])=>{
    const uid=nid(us,uf),did=nid(ds,df);
    const sp=pos.get(uid),dp=pos.get(did);
    if(!sp||!dp)return;
    const x1=sp.x+NW,y1=sp.y+NH/2,x2=dp.x,y2=dp.y+NH/2;
    const cx=(x1+x2)/2;
    const d=`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",d);
    path.setAttribute("class","edge");
    path.dataset.from=uid;path.dataset.to=did;

    // 유량 비례 굵기 (Q: 0→1.5px, 200→10px)
    const upQ=MET[uid]?.q??0;
    const sw=upQ>0?Math.max(1.5,Math.min(10,1.5+upQ/25)):1;
    path.style.strokeWidth=sw+"px";

    // 상태 색
    const stTo=ST[did];
    let edgeColor='#1e3a5f';
    if(stTo==='err')edgeColor='#ef4444';
    else if(stTo==='warn')edgeColor='#f59e0b60';
    else if(stTo==='off')edgeColor='#1e293b40';
    path.style.stroke=edgeColor;
    svg.appendChild(path);

    // 물흐름 파티클
    if(upQ>0){
      const pColor=stTo==='err'?'#f87171':'#34d399';
      const dur=Math.max(1.5,4-upQ/80)+'s';
      for(let pi=0;pi<3;pi++){
        const g=document.createElementNS("http://www.w3.org/2000/svg","circle");
        g.setAttribute("r",Math.max(1.8,sw/2.5));
        g.setAttribute("fill",pColor);
        g.setAttribute("class","flow-particle");
        g.dataset.from=uid;g.dataset.to=did;
        const am=document.createElementNS("http://www.w3.org/2000/svg","animateMotion");
        am.setAttribute("dur",dur);
        am.setAttribute("repeatCount","indefinite");
        am.setAttribute("begin",(pi*1.15)+'s');
        am.setAttribute("path",d);
        g.appendChild(am);
        svg.appendChild(g);
      }
    }
  });

  // 레이어 라벨
  const depLabels=["원수","1차","2차","3차","4차","5차","6차","7차"];
  const usedDeps=new Set(nodes.map(id=>NM.get(id).dep));
  usedDeps.forEach(dep=>{
    const lbl=document.createElement("div");
    lbl.className="layer-label";
    lbl.textContent=depLabels[dep]||`D${dep}`;
    lbl.style.left=(PAD_L+dep*COL_GAP+NW/2-6)+"px";
    lbl.style.top="4px";
    inner.appendChild(lbl);
  });

  applyTransform();
  renderMinimap();
}

// ═══════════════════════════════════════
// 줌/팬
// ═══════════════════════════════════════
function applyTransform(){
  document.getElementById("canvasInner").style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById("zoomLabel").textContent=Math.round(zoom*100)+"%";
  updateMmViewport();
}
function zoomBy(factor){
  const cv=document.getElementById("canvas").getBoundingClientRect();
  const cx=cv.width/2,cy=cv.height/2;
  const newZ=Math.max(.15,Math.min(3,zoom*factor));
  panX=cx-(cx-panX)*(newZ/zoom);panY=cy-(cy-panY)*(newZ/zoom);
  zoom=newZ;applyTransform();
}
function fitView(){
  if(!currentLayout)return;
  const cv=document.getElementById("canvas").getBoundingClientRect();
  let minX=1e9,minY=1e9,maxX=0,maxY=0;
  currentLayout.pos.forEach(p=>{
    minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x+NW);maxY=Math.max(maxY,p.y+NH);
  });
  const w=maxX-minX+120,h=maxY-minY+80;
  zoom=Math.min(cv.width/w,cv.height/h,.95);
  panX=(cv.width-w*zoom)/2-minX*zoom+60*zoom;
  panY=(cv.height-h*zoom)/2-minY*zoom+40*zoom;
  applyTransform();
}

// 마우스 드래그
{let dragging=false,sx,sy,spx,spy;
const cv=document.getElementById("canvas");
cv.addEventListener("mousedown",e=>{if(e.target.closest(".nd,.minimap"))return;dragging=true;sx=e.clientX;sy=e.clientY;spx=panX;spy=panY;cv.classList.add("dragging")});
window.addEventListener("mousemove",e=>{if(!dragging)return;panX=spx+(e.clientX-sx);panY=spy+(e.clientY-sy);applyTransform()});
window.addEventListener("mouseup",()=>{dragging=false;cv.classList.remove("dragging")});
cv.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;
  const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const newZ=Math.max(.15,Math.min(3,zoom*f));
  panX=mx-(mx-panX)*(newZ/zoom);panY=my-(my-panY)*(newZ/zoom);
  zoom=newZ;applyTransform()},{passive:false});
}

// ═══════════════════════════════════════
// 노드 클릭 → 하이라이트 + 팝업
// ═══════════════════════════════════════
function onNodeClick(id){
  if(selectedNode===id){selectedNode=null;clearHighlight();return}
  selectedNode=id;
  const connected=new Set([id]);
  const uq=[id];while(uq.length){const c=uq.shift();NM.get(c)?.pa.forEach(p=>{if(currentLayout.pos.has(p)&&!connected.has(p)){connected.add(p);uq.push(p)}})}
  const dq=[id];while(dq.length){const c=dq.shift();NM.get(c)?.ch.forEach(k=>{if(currentLayout.pos.has(k)&&!connected.has(k)){connected.add(k);dq.push(k)}})}

  document.querySelectorAll(".nd").forEach(el=>{
    el.classList.toggle("highlight",el.dataset.id===id);
    el.classList.toggle("dim",!connected.has(el.dataset.id));
  });
  document.querySelectorAll(".edge").forEach(el=>{
    const from=el.dataset.from,to=el.dataset.to;
    const isConn=connected.has(from)&&connected.has(to);
    el.classList.toggle("hl",isConn);
    el.classList.toggle("dim",!isConn);
  });
  document.querySelectorAll(".flow-particle").forEach(el=>{
    const from=el.dataset.from,to=el.dataset.to;
    el.classList.toggle("dim",!(connected.has(from)&&connected.has(to)));
  });
  showPopup(id);
}
function clearHighlight(){
  document.querySelectorAll(".nd").forEach(el=>{el.classList.remove("highlight","dim")});
  document.querySelectorAll(".edge").forEach(el=>{el.classList.remove("hl","dim")});
  document.querySelectorAll(".flow-particle").forEach(el=>{el.classList.remove("dim")});
}

function showPopup(id){
  const n=NM.get(id);if(!n)return;
  const m=MET[id]||{};
  document.getElementById("popupTitle").textContent=`${n.sn} (${n.ft})`;
  const stLabel={ok:"정상",warn:"주의",err:"이상",off:"OFF"};
  const stColor={ok:"#34d399",warn:"#fbbf24",err:"#ef4444",off:"#64748b"};
  const st=ST[id]||'ok';

  // 하위 자손 정보
  const stats=getSubtreeStats(id);
  const directChildren=[...n.ch];

  let childrenHtml='';
  if(directChildren.length>0){
    const tags=directChildren.map(ch=>{
      const cn=NM.get(ch);
      return `<span class="popup-child-tag st-${ST[ch]||'ok'}">${cn.sn} (${cn.ft})</span>`;
    }).join('');
    childrenHtml=`
      <div class="popup-children">
        <h4>직접 연결 (${directChildren.length}개) ${stats.count>directChildren.length?`· 전체 자손 ${stats.count}개`:''}</h4>
        <div class="popup-child-list">${tags}</div>
      </div>`;
  }

  document.getElementById("popupBody").innerHTML=`
    <div class="popup-cell"><div class="pc-label">상태</div><div class="pc-val" style="color:${stColor[st]}">${stLabel[st]}</div></div>
    <div class="popup-cell"><div class="pc-label">유량 Q</div><div class="pc-val" style="color:#3b82f6">${m.q??'-'}</div></div>
    <div class="popup-cell"><div class="pc-label">압력 P</div><div class="pc-val" style="color:#f59e0b">${m.p??'-'}</div></div>
    <div class="popup-cell"><div class="pc-label">${n.ft==='배수지'?'수위 H':'—'}</div><div class="pc-val" style="color:#34d399">${m.h??'-'}</div></div>
    ${stats.count>0?`
    <div class="popup-cell" style="grid-column:1/-1">
      <div class="pc-label">하위 시설 요약 (${stats.count}개)</div>
      <div style="display:flex;gap:12px;margin-top:6px;font-size:12px">
        <span style="color:#34d399">정상 ${stats.ok}</span>
        <span style="color:#fbbf24">주의 ${stats.warn}</span>
        <span style="color:#ef4444">이상 ${stats.err}</span>
        <span style="color:#64748b">OFF ${stats.off}</span>
        <span style="color:#3b82f6;margin-left:auto">총 유량 ${stats.totalQ}</span>
      </div>
    </div>`:''}
    ${childrenHtml}
  `;
  document.getElementById("popup").classList.add("show");
}
function closePopup(){
  document.getElementById("popup").classList.remove("show");
}

// ═══════════════════════════════════════
// 미니맵
// ═══════════════════════════════════════
function renderMinimap(){
  if(!currentLayout)return;
  const canvas=document.getElementById("mmCanvas");
  const ctx=canvas.getContext("2d");
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);

  let minX=1e9,minY=1e9,maxX=0,maxY=0;
  currentLayout.pos.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x+NW);maxY=Math.max(maxY,p.y+NH)});
  const pad=20;
  const scaleX=(W-pad*2)/(maxX-minX+1);
  const scaleY=(H-pad*2)/(maxY-minY+1);
  const sc=Math.min(scaleX,scaleY);

  // 엣지
  ctx.strokeStyle='#1e3a5f';ctx.lineWidth=.5;
  currentLayout.edges.forEach(([us,uf,ds,df])=>{
    const sp=currentLayout.pos.get(nid(us,uf)),dp=currentLayout.pos.get(nid(ds,df));
    if(!sp||!dp)return;
    ctx.beginPath();
    ctx.moveTo(pad+(sp.x+NW-minX)*sc,pad+(sp.y+NH/2-minY)*sc);
    ctx.lineTo(pad+(dp.x-minX)*sc,pad+(dp.y+NH/2-minY)*sc);
    ctx.stroke();
  });

  // 노드
  currentLayout.nodes.forEach(id=>{
    const p=currentLayout.pos.get(id);if(!p)return;
    const n=NM.get(id);
    ctx.fillStyle=FTC[n.ft]||'#64748b';
    const isCol=collapsed.has(id)&&n.ch.size>0;
    const w=isCol?5:3,h=isCol?5:3;
    ctx.fillRect(pad+(p.x-minX)*sc,pad+(p.y-minY)*sc,w,h);
  });

  // 뷰포트 저장 기하
  window._mmGeo={minX,minY,maxX,maxY,sc,pad,W,H};
  updateMmViewport();
}
function updateMmViewport(){
  if(!window._mmGeo)return;
  const {minX,minY,sc,pad}=window._mmGeo;
  const cv=document.getElementById("canvas").getBoundingClientRect();
  const vp=document.getElementById("mmViewport");
  const x=(-panX/zoom-minX+0)*sc+pad;
  const y=(-panY/zoom-minY+0)*sc+pad;
  const w=(cv.width/zoom)*sc;
  const h=(cv.height/zoom)*sc;
  vp.style.left=x+"px";vp.style.top=y+"px";vp.style.width=w+"px";vp.style.height=h+"px";
}

  searchResults.querySelectorAll(".sr-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.id;
      searchResults.classList.remove("show");searchInput.value='';
      // 경로 펼치기 + 렌더링
      expandPathTo(id);
      renderAll();
      // 렌더 후 포커스
      setTimeout(()=>{
        const pos=currentLayout?.pos.get(id);
        if(pos){
          const cv=document.getElementById("canvas").getBoundingClientRect();
          panX=cv.width/2-(pos.x+NW/2)*zoom;
          panY=cv.height/2-(pos.y+NH/2)*zoom;
          applyTransform();
          onNodeClick(id);
        }
      },100);
    });
  });
});
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const first=searchResults.querySelector(".sr-item");
    if(first)first.click();
  }
  if(e.key==="Escape"){searchResults.classList.remove("show")}
});
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))searchResults.classList.remove("show")});

// 배경 클릭 → 선택 해제
document.getElementById("canvas").addEventListener("click",e=>{
  if(!e.target.closest(".nd")&&!e.target.closest(".minimap")){
    selectedNode=null;clearHighlight();closePopup();
  }
});

// 힌트 자동 숨김
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.style.opacity="0"},5000);

// ═══════════════════════════════════════
// 초기 렌더링
// ═══════════════════════════════════════
renderAll();
</script>
</body>
</html>
