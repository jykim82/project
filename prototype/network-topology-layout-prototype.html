// 토폴로지 정렬 시안 — 레이아웃 코어 (모니터링 hierarchical-topology.ts 포트)
// 프로토타입 검증용: node 로 단독 실행 가능, HTML 에 그대로 인라인

const KNOWN_NETWORK_LAYERS = [
  { types: ["제어망", "업무망"], label: "CORE · 제어/업무망", c: "56,189,248" },
  { types: ["정수장"], label: "정수장", c: "96,165,250" },
  { types: ["가압장"], label: "가압장", c: "251,191,36" },
  { types: ["배수지"], label: "배수지", c: "52,211,153" },
  { types: ["감압시설", "감압설비"], label: "감압설비", c: "244,114,182" },
  { types: ["소블록", "소소블록"], label: "소블록 · 소소블록", c: "167,139,250" },
  { types: ["수압계실", "유량계실"], label: "수압계실 · 유량계실", c: "6,182,212" },
];
const UNKNOWN_LAYER_COLOR = "148,163,184";

function buildNetworkLayers(presentTypes) {
  const present = new Set(presentTypes);
  const layers = [];
  const covered = new Set();
  for (const def of KNOWN_NETWORK_LAYERS) {
    def.types.forEach((t) => covered.add(t));
    if (def.types.some((t) => present.has(t))) layers.push(def);
  }
  for (const t of [...present].sort()) {
    if (!covered.has(t) && t) layers.push({ types: [t], label: t, c: UNKNOWN_LAYER_COLOR });
  }
  return layers;
}

// ── A. 현재 방식: 계층 정렬 격자 (링크 에디터 layout.ts layerLayout 동일) ──
const G = { NODE_W: 168, NODE_H: 46, COL_W: 220, ROW_H: 64, COLS: 6, GAP: 40 };

function gridLayerLayout(nodes) {
  const result = new Map();
  const layers = buildNetworkLayers(nodes.map((n) => n.category ?? ""));
  let bandY = 0;
  const bands = [];
  for (const layer of layers) {
    const lns = nodes.filter((n) => layer.types.includes(n.category ?? ""));
    if (!lns.length) continue;
    const sites = new Map();
    for (const n of lns) {
      const key = n.sitename || "미지정";
      if (!sites.has(key)) sites.set(key, []);
      sites.get(key).push(n);
    }
    let col = 0, row = 0;
    for (const key of [...sites.keys()].sort()) {
      for (const n of sites.get(key)) {
        if (col >= G.COLS) { col = 0; row += 1; }
        result.set(n.id, { x: col * G.COL_W, y: bandY + row * G.ROW_H });
        col += 1;
      }
    }
    bands.push({ label: layer.label, c: layer.c, y: bandY - 14, h: (row + 1) * G.ROW_H + 18, w: G.COLS * G.COL_W });
    bandY += (row + 1) * G.ROW_H + G.GAP;
  }
  return { pos: result, bands, w: G.COLS * G.COL_W, h: bandY };
}

// ── B. 제안: 토폴로지 정렬 (모니터링 computeHierarchicalLayout 포트) ──
const NW = 72, NH = 28, SITE_PAD = 12, SITE_GAP = 20;
const NODE_GAP_X = 6, NODE_GAP_Y = 6, PAD = 50;
const MAX_COLS_CLUSTER = 3, COL_GAP = 24, ROW_GAP = 16, NUM_COLS = 3;
const PRIMARY_COL = [0, 1, 3];

function clusterSize(count) {
  const cols = Math.min(MAX_COLS_CLUSTER, count);
  const rows = Math.ceil(count / cols);
  return {
    w: cols * NW + (cols - 1) * NODE_GAP_X + SITE_PAD * 2,
    h: rows * NH + (rows - 1) * NODE_GAP_Y + SITE_PAD * 2 + 16,
    cols,
  };
}

function groupActiveLayers(nodes) {
  const result = [];
  const layers = buildNetworkLayers(nodes.map((n) => n.category ?? ""));
  for (const lc of layers) {
    const layerNodes = nodes.filter((n) => lc.types.includes(n.category));
    if (!layerNodes.length) continue;
    const siteMap = new Map();
    for (const n of layerNodes) {
      if (!siteMap.has(n.sitename)) siteMap.set(n.sitename, []);
      siteMap.get(n.sitename).push(n);
    }
    const sorted = [...siteMap.entries()].sort((a, b) => {
      const aE = a[1].some((n) => n.status === "이상");
      const bE = b[1].some((n) => n.status === "이상");
      if (aE !== bE) return aE ? -1 : 1;
      return a[0].localeCompare(b[0], "ko");
    });
    result.push({ config: lc, sites: sorted, nodeCount: layerNodes.length });
  }
  return result;
}

function layoutSitesInBand(layer, startX, startY, targetW, nodePos) {
  let curX = startX;
  let curY = startY + 20;
  let rowMaxH = 0;
  let maxW = 0;
  for (const [sitename, siteNodes] of layer.sites) {
    const cs = clusterSize(siteNodes.length);
    if (curX + cs.w > startX + targetW && curX > startX) {
      curY += rowMaxH + SITE_GAP * 0.6;
      curX = startX;
      rowMaxH = 0;
    }
    for (let i = 0; i < siteNodes.length; i++) {
      const col = i % cs.cols;
      const row = Math.floor(i / cs.cols);
      nodePos.set(siteNodes[i].id, {
        x: curX + SITE_PAD + col * (NW + NODE_GAP_X),
        y: curY + 16 + SITE_PAD + row * (NH + NODE_GAP_Y),
        w: NW, h: NH,
        clusterX: curX, clusterY: curY, clusterW: cs.w, clusterH: cs.h,
        sitename,
      });
    }
    rowMaxH = Math.max(rowMaxH, cs.h);
    maxW = Math.max(maxW, curX + cs.w - startX);
    curX += cs.w + SITE_GAP * 0.7;
  }
  const totalH = curY - startY + rowMaxH + 24;
  return { usedW: maxW, usedH: totalH };
}

function computeHierarchicalLayout(nodes, viewportW, viewportH) {
  const activeLayers = groupActiveLayers(nodes);
  if (!activeLayers.length) return { layers: [], nodePos: new Map(), svgW: 800, svgH: 600 };
  const vpAspect = viewportW / viewportH;

  const columns = Array.from({ length: NUM_COLS }, () => ({ layerIdxs: [], totalH: 0 }));
  for (let c = 0; c < NUM_COLS; c++) {
    const idx = PRIMARY_COL[c];
    if (idx < activeLayers.length) columns[c].layerIdxs.push(idx);
  }

  let bestColW = 800, bestScore = Infinity;
  for (let colW = 500; colW <= 1200; colW += 50) {
    const colHeights = columns.map((col) => {
      let h = 0;
      for (const idx of col.layerIdxs) {
        const { usedH } = layoutSitesInBand(activeLayers[idx], 0, 0, colW, new Map());
        h += usedH + ROW_GAP;
      }
      return h;
    });
    const assigned = new Set(PRIMARY_COL.filter((i) => i < activeLayers.length));
    const simH = [...colHeights];
    for (let i = 0; i < activeLayers.length; i++) {
      if (assigned.has(i)) continue;
      const { usedH } = layoutSitesInBand(activeLayers[i], 0, 0, colW, new Map());
      let minC = 0;
      for (let c = 1; c < NUM_COLS; c++) if (simH[c] < simH[minC]) minC = c;
      simH[minC] += usedH + ROW_GAP;
    }
    const maxH = Math.max(...simH);
    const totalW = NUM_COLS * colW + (NUM_COLS - 1) * COL_GAP + PAD * 2;
    const score = Math.abs(Math.log((totalW / (maxH + PAD * 2)) / vpAspect));
    if (score < bestScore) { bestScore = score; bestColW = colW; }
  }
  const colW = bestColW;

  for (const col of columns) {
    col.totalH = 0;
    for (const idx of col.layerIdxs) {
      const { usedH } = layoutSitesInBand(activeLayers[idx], 0, 0, colW, new Map());
      col.totalH += usedH + ROW_GAP;
    }
  }
  const assigned = new Set(PRIMARY_COL.filter((i) => i < activeLayers.length));
  for (let i = 0; i < activeLayers.length; i++) {
    if (assigned.has(i)) continue;
    const { usedH } = layoutSitesInBand(activeLayers[i], 0, 0, colW, new Map());
    let minC = 0;
    for (let c = 1; c < NUM_COLS; c++) if (columns[c].totalH < columns[minC].totalH) minC = c;
    columns[minC].layerIdxs.push(i);
    columns[minC].totalH += usedH + ROW_GAP;
  }
  const maxColH = Math.max(...columns.map((c) => c.totalH));

  const nodePos = new Map();
  const layers = [];
  const totalW = NUM_COLS * colW + (NUM_COLS - 1) * COL_GAP + PAD * 2;
  for (let c = 0; c < NUM_COLS; c++) {
    const colX = PAD + c * (colW + COL_GAP);
    const layerCount = columns[c].layerIdxs.length;
    const contentH = columns[c].totalH - layerCount * ROW_GAP;
    const extraSpace = maxColH - contentH;
    const gapPerSlot = layerCount > 0 ? extraSpace / layerCount : 0;
    let curY = PAD;
    for (const idx of columns[c].layerIdxs) {
      const layer = activeLayers[idx];
      const { usedW, usedH } = layoutSitesInBand(layer, colX, curY, colW, nodePos);
      layers.push({
        config: layer.config, sites: layer.sites,
        bandX: colX - 6, bandY: curY - 10,
        bandW: Math.max(usedW, colW) + 12, bandH: usedH + gapPerSlot + 10,
      });
      curY += usedH + gapPerSlot;
    }
  }
  return { layers, nodePos, svgW: totalW, svgH: maxColH + PAD * 2 };
}

// 링크 에디터 노드 크기(168×46)로 스케일 변환 — "토폴로지 정렬" 저장 좌표 산출
function topologyLayoutForEditor(nodes, viewportW, viewportH) {
  const SX = G.NODE_W / NW;  // 2.333
  const SY = G.NODE_H / NH;  // 1.643
  const { layers, nodePos, svgW, svgH } = computeHierarchicalLayout(nodes, viewportW, viewportH);
  const pos = new Map();
  for (const [id, p] of nodePos) {
    pos.set(id, {
      x: Math.round(p.x * SX), y: Math.round(p.y * SY),
      clusterX: p.clusterX * SX, clusterY: p.clusterY * SY,
      clusterW: p.clusterW * SX, clusterH: p.clusterH * SY,
      sitename: p.sitename,
    });
  }
  const bands = layers.map((l) => ({
    label: l.config.label, c: l.config.c,
    x: l.bandX * SX, y: l.bandY * SY, w: l.bandW * SX, h: l.bandH * SY,
  }));
  return { pos, bands, w: svgW * SX, h: svgH * SY };
}




// ── SVG 렌더링 ──
const PROTO_STYLE = {
  sslvpn: { c: "#3b82f6", w: 2, dash: "" },
  xgt_glofa_enet: { c: "#14b8a6", w: 1.5, dash: "" },
  modbus_rtu: { c: "#64748b", w: 1, dash: "4 3" },
  oneway_diode: { c: "#ef4444", w: 2.5, dash: "" },
  unknown: { c: "#334155", w: 1, dash: "2 2" },
};
const ST_COLOR = { "정상": "#34d399", "이상": "#f43f5e" };
const NS = "http://www.w3.org/2000/svg";
function el(t, a) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; }

function render(svgId, layout, drawClusters) {
  const svg = document.getElementById(svgId);
  const { pos, bands, w, h } = layout;
  svg.setAttribute("viewBox", `-20 -30 ${w + 60} ${h + 60}`);
  svg.dataset.w = w + 60;

  // 밴드
  for (const b of bands) {
    svg.appendChild(el("rect", { x: b.x ?? -10, y: b.y, width: b.w ?? (w + 20), height: b.h,
      fill: `rgba(${b.c},0.05)`, stroke: `rgba(${b.c},0.35)`, "stroke-dasharray": "6 4", rx: 8 }));
    const t = el("text", { x: (b.x ?? -10) + 8, y: b.y + 14, fill: `rgba(${b.c},0.9)`, "font-size": "12", "font-weight": "bold" });
    t.textContent = b.label;
    svg.appendChild(t);
  }
  // 사이트 클러스터 (토폴로지 전용)
  if (drawClusters) {
    const seen = new Set();
    for (const p of pos.values()) {
      const key = p.sitename + "|" + p.clusterX + "|" + p.clusterY;
      if (seen.has(key)) continue;
      seen.add(key);
      svg.appendChild(el("rect", { x: p.clusterX, y: p.clusterY, width: p.clusterW, height: p.clusterH,
        fill: "rgba(148,163,184,0.04)", stroke: "rgba(148,163,184,0.3)", rx: 6 }));
      const t = el("text", { x: p.clusterX + 6, y: p.clusterY + 13, fill: "#8fa8c5", "font-size": "10" });
      t.textContent = p.sitename;
      svg.appendChild(t);
    }
  }
  // 링크
  for (const e of DATA.edges) {
    const s = pos.get(e.source), t = pos.get(e.target);
    if (!s || !t) continue;
    const st = PROTO_STYLE[e.link_protocol] || PROTO_STYLE.unknown;
    const x1 = s.x + G.NODE_W / 2, y1 = s.y + G.NODE_H / 2;
    const x2 = t.x + G.NODE_W / 2, y2 = t.y + G.NODE_H / 2;
    const mx = (x1 + x2) / 2;
    svg.appendChild(el("path", { d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`,
      fill: "none", stroke: st.c, "stroke-width": st.w, "stroke-dasharray": st.dash, opacity: 0.55 }));
  }
  // 노드
  for (const n of DATA.nodes) {
    const p = pos.get(n.id);
    if (!p) continue;
    const bc = n.status ? (ST_COLOR[n.status] || "#f59e0b") : (n.has_ip ? "#f59e0b" : "#475569");
    svg.appendChild(el("rect", { x: p.x, y: p.y, width: G.NODE_W, height: G.NODE_H,
      fill: "#0e1628", stroke: bc, "stroke-width": 1.6, rx: 6 }));
    const t1 = el("text", { x: p.x + 8, y: p.y + 18, fill: "#dce6f2", "font-size": "11", "font-weight": "bold" });
    t1.textContent = `${n.equipmenttype} · ${n.sitename}`;
    const t2 = el("text", { x: p.x + 8, y: p.y + 35, fill: "#8fa8c5", "font-size": "10" });
    t2.textContent = n.ip_address || "시리얼";
    svg.appendChild(t1); svg.appendChild(t2);
  }
}

const grid = gridLayerLayout(DATA.nodes);
const topo = topologyLayoutForEditor(DATA.nodes, 1600, 900);
render("svg-grid", grid, false);
render("svg-topo", topo, true);
document.getElementById("stats").innerHTML =
  `장비 <b>${DATA.nodes.length}</b> · 링크 <b>${DATA.edges.length}</b> · ` +
  `격자 캔버스 <b>${Math.round(grid.w)}×${Math.round(grid.h)}</b> · 토폴로지 캔버스 <b>${Math.round(topo.w)}×${Math.round(topo.h)}</b>`;

// 탭 + 줌
document.querySelectorAll(".tab[data-p]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tab[data-p]").forEach((x) => x.classList.toggle("active", x === b));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + b.dataset.p));
}));
const zr = document.getElementById("zoomRange");
function applyZoom() {
  document.getElementById("zoomVal").textContent = zr.value + "%";
  for (const id of ["svg-grid", "svg-topo"]) {
    const s = document.getElementById(id);
    s.setAttribute("width", (s.dataset.w * zr.value) / 100);
  }
}
zr.addEventListener("input", applyZoom);
applyZoom();
</script>
