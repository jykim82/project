services:
  # ============================================================
  # TimescaleDB (PostgreSQL 16 + TimescaleDB 2.25.1)
  # ============================================================
  timescaledb:
    image: timescale/timescaledb:2.25.1-pg16
    container_name: slm-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-slm}
      POSTGRES_USER: ${DB_USER:-slm_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slm_dev_1234}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - /Users/jykim/data/docker/timescaledb:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=timescaledb
        -c timezone=Asia/Seoul
        -c log_timezone=Asia/Seoul
        -c max_connections=100
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slm_dev -d slm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Node-RED (알람 조건 로직)
  # ============================================================
  node-red:
    image: nodered/node-red
    container_name: slm-node-red
    ports:
      - "1880:1880"
    volumes:
      - /Users/jykim/data/docker/node-red:/data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Backend (FastAPI + Python AI 서버)
  # ============================================================
  backend:
    build:
      context: ../slm
      dockerfile: Dockerfile
    container_name: slm-backend
    ports:
      - "8000:8000"
    volumes:
      - ../slm:/app
      - backend-venv:/app/venv          # venv 제외 (컨테이너 자체 pip)
      # [E-025] 비전 에이전트 사진 공유 — backend(컨테이너)와 host vision_agent가
      # 동일 파일을 읽어야 하므로 host ../web/files 를 /data/files 로 바인드.
      - ./files:/data/files
    environment:
      TZ: Asia/Seoul
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-slm}
      DB_USER: ${DB_USER:-slm_dev}
      DB_PASSWORD: ${DB_PASSWORD:-slm_dev_1234}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:26b}
      # vision_agent는 호스트에서 별도 프로세스로 실행 (포트 8100)
      VISION_AGENT_URL: ${VISION_AGENT_URL:-http://host.docker.internal:8100}
      FILES_BASE: /data/files
      # [E-025] 컨테이너 측 파일 경로 — host vision_agent는 기본값(../web/files/...)을 사용.
      # 둘 다 /api/files/... URL 형식을 각자 env로 local path 해석.
      CHAT_ATTACHMENT_DIR: /data/files/chat_attachments
      FACILITY_FILE_BASE_DIR: /data/files/facility
      PYTHONUNBUFFERED: "1"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # [DEV-ONLY] tb_tag_raw_data 원격 → 로컬 복제 데몬
  # ============================================================
  # 목적: 테스트 환경에서 원격 운영 DB(참고 사이트)의 실측 시계열을
  #       로컬 TimescaleDB로 주기 복제해 모니터링/트렌드/이상감지 검증 가능하게 함.
  # 납품 시 제거: 이 서비스 블록과 ../slm/dev_tools/ 디렉토리 전체 삭제.
  #               운영 환경은 실제 PLC/Node-RED 수집 파이프라인을 사용하므로 불필요.
  # 상세 사양: docs/dev-tag-ingest-spec.md
  dev-tag-ingest:
    build:
      context: ../slm/dev_tools
      dockerfile: Dockerfile.tag_ingest
    container_name: slm-dev-tag-ingest
    environment:
      TZ: Asia/Seoul
      # 로컬 TimescaleDB (같은 compose 네트워크)
      LOCAL_DB_HOST: timescaledb
      LOCAL_DB_PORT: "5432"
      LOCAL_DB_NAME: ${DB_NAME:-slm}
      LOCAL_DB_USER: ${DB_USER:-slm_dev}
      LOCAL_DB_PASSWORD: ${DB_PASSWORD:-slm_dev_1234}
      LOCAL_REGION: ${DEV_TAG_INGEST_REGION:-KW}
      # 원격 운영 DB (외부)
      REMOTE_DB_HOST: ${REMOTE_DB_HOST:-112.166.183.65}
      REMOTE_DB_PORT: ${REMOTE_DB_PORT:-25479}
      REMOTE_DB_NAME: ${REMOTE_DB_NAME:-postgres}
      REMOTE_DB_USER: ${REMOTE_DB_USER:-postgres}
      REMOTE_DB_PASSWORD: ${REMOTE_DB_PASSWORD:-DJpost0827///}
      # 폴링 파라미터
      POLL_INTERVAL_S: ${DEV_TAG_INGEST_POLL_S:-30}
      BACKFILL_HOURS: ${DEV_TAG_INGEST_BACKFILL_H:-48}
      BACKOFF_S: ${DEV_TAG_INGEST_BACKOFF_S:-15}
      BATCH_SIZE: ${DEV_TAG_INGEST_BATCH:-5000}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Frontend (Next.js 대시보드)
  # ============================================================
  frontend:
    build:
      context: slm-dashboard/slm-dashboard
      dockerfile: Dockerfile
    container_name: slm-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./slm-dashboard/slm-dashboard:/app
      - ./certs:/certs:ro                          # HTTPS 인증서 마운트
      - frontend-node-modules:/app/node_modules   # node_modules 보호
      - frontend-next-cache:/app/.next             # .next 캐시 보호
      # [P1-C] /api/files/... 라우트가 읽을 파일 저장소 (backend와 동일 경로)
      - ./files:/data/files
    environment:
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost:3000}
      # 반드시 .env 또는 deploy secret으로 오버라이드 — 여기 default는 dev 편의용 약한 값
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql://slm_dev:slm_dev_1234@timescaledb:5432/slm}
      FILE_STORAGE_PATH: /data/files
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================================
  # [DEV-ONLY] Turbopack JIT 컴파일 프리워밍 사이드카
  # ============================================================
  # 목적: `next dev --turbopack`이 첫 페이지/프록시 라우트 요청마다 JIT 컴파일
  #       (관측 18초+)하는 지연을, 서버 기동 직후 자동 curl로 미리 트리거해 제거.
  #       백엔드 /flow-map/realtime 등도 함께 warm해 IForest/SCAN_ALL 백그라운드
  #       작업과 사용자 첫 요청의 경합 가능성을 낮춤.
  # 납품 시 제거: 이 서비스 블록 삭제. 운영 빌드(`next build && next start`)는
  #               JIT 컴파일이 없어 이 사이드카가 불필요.
  # 관련 이력: docs/error-management.md E-017 (첫 접속 18s)
  frontend-prewarm:
    image: curlimages/curl:latest
    container_name: slm-frontend-prewarm
    volumes:
      - ../slm/dev_tools/prewarm.sh:/prewarm.sh:ro
    environment:
      FRONTEND_URL: https://frontend:3000
      BACKEND_URL: http://backend:8000
      MAX_WAIT_S: "180"
    entrypoint: ["/bin/sh", "/prewarm.sh"]
    depends_on:
      - frontend
      - backend
    restart: "no"

volumes:
  backend-venv:
  frontend-node-modules:
  frontend-next-cache:
